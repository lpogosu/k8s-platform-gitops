---
# Step 1 of the local PKI: an issuer that signs with the requesting key itself.
# It is used exactly once, to sign the root CA certificate below. Workloads
# never reference it directly, because a self-signed leaf gives every service a
# different, untrusted certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
