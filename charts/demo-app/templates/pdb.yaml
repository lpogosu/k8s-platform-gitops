{{- if .Values.podDisruptionBudget.enabled }}
---
# A PDB with minAvailable >= the replica count blocks node drains forever, so
# the chart refuses that combination instead of letting it reach the cluster.
{{- $replicas := ternary (int .Values.autoscaling.minReplicas) (int .Values.replicaCount) .Values.autoscaling.enabled }}
{{- if ge (int .Values.podDisruptionBudget.minAvailable) $replicas }}
{{- fail (printf "podDisruptionBudget.minAvailable (%d) must be lower than the minimum replica count (%d)" (int .Values.podDisruptionBudget.minAvailable) $replicas) }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "demo-app.fullname" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "demo-app.selectorLabels" . | nindent 6 }}
{{- end }}
