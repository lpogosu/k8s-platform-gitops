---
# Values shared by every environment. Anything that differs between dev, stage
# and prod is deliberately absent here and lives as a patch in the overlay, so
# that a diff between two environments is a short, readable file.

# Short, predictable object names: the overlays patch by name, and
# "demo-app-demo-app" would be both ugly and fragile.
fullnameOverride: demo-app

image:
  repository: ealen/echo-server
  tag: "0.9.2"
  digest: sha256:006b92e1d6682442e29d1d0d73c34a61166d42f8a5bf1ea10c318f07ad4790e2
  pullPolicy: IfNotPresent

# Every environment autoscales except dev, which removes the HPA outright.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  # Every overlay replaces this. `.invalid` is reserved by RFC 2606 precisely
  # so that a name which must never resolve cannot accidentally start
  # resolving, while `kustomize build deploy/base` still yields a
  # schema-correct Ingress.
  host: demo.invalid
  tls:
    enabled: false

echo:
  exposeEnvironment: false
  exposeHeaders: true
  ignoreProbeLogs: true

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    memory: 128Mi
