---
# dev: one replica, no autoscaling, no disruption budget, and the echo response
# includes the pod environment. The point of dev is to be debuggable, not
# highly available.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - ../../base
  - namespace.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/environment: dev

patches:
  - path: deployment.yaml
  - path: ingress.yaml
    target:
      kind: Ingress
      name: demo-app
  # A single-replica deployment cannot satisfy any PDB, and an unsatisfiable
  # PDB blocks `kubectl drain` indefinitely.
  - target:
      kind: PodDisruptionBudget
      name: demo-app
    patch: |
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: demo-app
  - target:
      kind: HorizontalPodAutoscaler
      name: demo-app
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: demo-app
