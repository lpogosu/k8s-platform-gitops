---
# Platform components. These legitimately need cluster-scoped objects
# (CRDs, ClusterRoles, ClusterIssuers, ValidatingWebhookConfigurations), so the
# project is permissive about cluster resources but restricted about where the
# manifests may come from.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster platform components managed by the app-of-apps root

  sourceRepos:
    - https://github.com/lpogosu/k8s-platform-gitops.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://bitnami.github.io/sealed-secrets
    - https://kubernetes-sigs.github.io/metrics-server

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: sealed-secrets
    - server: https://kubernetes.default.svc
      namespace: kube-system

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true
