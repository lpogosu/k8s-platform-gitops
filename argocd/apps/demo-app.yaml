---
# Only the dev overlay is wired up on the local cluster. stage and prod are
# built and schema-checked in CI; pointing all three at one kind cluster would
# just be three copies of the same pods on the same nodes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: workloads
  source:
    repoURL: https://github.com/lpogosu/k8s-platform-gitops.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Remove the workload before the namespace when the app is deleted.
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
