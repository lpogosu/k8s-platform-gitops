---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.14.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          # kind maps host ports 80/443 into the control-plane node, so the
          # controller has to run there and bind those ports directly.
          hostPort:
            enabled: true
            ports:
              http: 80
              https: 443
          nodeSelector:
            ingress-ready: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          service:
            type: ClusterIP
          watchIngressWithoutClass: false
          ingressClassResource:
            name: nginx
            default: true
          admissionWebhooks:
            enabled: true
          config:
            # Requests arrive through the Docker bridge; without this the
            # access log records the bridge address instead of the client.
            use-forwarded-headers: "true"
            proxy-body-size: 8m
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          metrics:
            enabled: false
        defaultBackend:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
