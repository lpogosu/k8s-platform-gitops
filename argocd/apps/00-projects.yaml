---
# AppProjects are bootstrapped once by scripts/bootstrap.sh (an Application
# cannot reference a project that does not exist yet), then handed over to
# Argo CD so that later edits go through git like everything else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-projects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform
  source:
    repoURL: https://github.com/lpogosu/k8s-platform-gitops.git
    targetRevision: main
    path: argocd/projects
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # No prune: pruning an AppProject would orphan every Application that
      # references it, including this one.
      prune: false
      selfHeal: true
