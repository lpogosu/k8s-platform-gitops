---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server
    chart: metrics-server
    targetRevision: 3.13.0
    helm:
      releaseName: metrics-server
      values: |
        args:
          # kind serves the kubelet API with a certificate that metrics-server
          # has no CA for; without this flag every scrape fails on TLS.
          - --kubelet-insecure-tls
          - --kubelet-preferred-address-types=InternalIP
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 192Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
